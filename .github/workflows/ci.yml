name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            sanitizers: "OFF"
          - compiler: clang++
            sanitizers: "ON"
    name: Linux / ${{ matrix.compiler }}
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 g++ clang libclang-rt-dev libopenxr-dev qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtquick-dialogs qml6-module-qtquick-templates \
            qml6-module-qtqml-workerscript
      - name: Check out the pinned loader for sanitizer tests
        if: matrix.sanitizers == 'ON'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhronosGroup/OpenXR-SDK
          ref: f2448a8797c85814aa892efc1ab8707900fbcc78 # release-1.1.63
          path: build/openxr-sdk
          persist-credentials: false
      - name: Build the loader for sanitizer tests
        if: matrix.sanitizers == 'ON'
        # Ubuntu's loader 1.0.20 leaks LoaderInstance on xrDestroyInstance.
        # Keep testing that version in the GCC job and use upstream's fixed
        # loader here, with all application/layer sanitizer checks enabled.
        run: |
          cmake -S build/openxr-sdk -B build/openxr-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=OFF -DBUILD_API_LAYERS=OFF \
            -DBUILD_WITH_SYSTEM_JSONCPP=OFF
          cmake --build build/openxr-linux --target openxr_loader --parallel 2
      - name: Configure
        run: |
          loader_options=()
          if [ '${{ matrix.sanitizers }}' = ON ]; then
            loader_options+=("-DARMSWING_OPENXR_LOADER=$GITHUB_WORKSPACE/build/openxr-linux/src/loader/libopenxr_loader.so")
          fi
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DBUILD_TESTING=ON \
            -DARMSWING_ENABLE_SANITIZERS=${{ matrix.sanitizers }} "${loader_options[@]}"
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
      - name: Check installation layout
        run: cmake --install build/ci --prefix "$RUNNER_TEMP/arm-swing-vr-install"
  windows-backends:
    runs-on: ubuntu-24.04
    name: Windows backends / MinGW and Wine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 g++-mingw-w64-x86-64 wine64 wine xvfb xauth
      - name: Configure and build Windows backends
        run: |
          cmake -S . -B build/windows -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw64.cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build/windows --parallel 2
      - name: Check out the pinned Khronos loader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhronosGroup/OpenXR-SDK
          ref: f2448a8797c85814aa892efc1ab8707900fbcc78 # release-1.1.63
          path: build/openxr-sdk
          persist-credentials: false
      - name: Build the Windows Khronos loader
        # MinGW's desktop headers lack the Windows SDK's SYSTEM partition macro.
        run: |
          cmake -S build/openxr-sdk -B build/openxr-windows -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/mingw64.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_API_LAYERS=OFF \
            -DDYNAMIC_LOADER=ON -DBUILD_WITH_SYSTEM_JSONCPP=OFF \
            -DCMAKE_CXX_FLAGS=-DWINAPI_PARTITION_SYSTEM=0
          cmake --build build/openxr-windows --target openxr_loader --parallel 2
      - name: Exercise Windows OpenVR and OpenXR under Wine
        run: >-
          xvfb-run -a python3 tools/test_wine.py --wine /usr/bin/wine
          --build build/windows --prefix build/armswing-ci-prefix
          --openxr-loader build/openxr-windows/src/loader/libopenxr_loader.dll
